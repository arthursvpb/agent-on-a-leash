[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-on-a-leash"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1,<2", "langchain-openai>=1,<2", "langgraph>=1,<2",
  "langsmith>=0.4,<1", "pydantic>=2,<3", "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["ruff", "mypy"]

[tool.setuptools]
packages = ["src", "evals"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.md"]

[tool.mypy]
strict = true
files = ["src", "evals"]

[tool.setuptools.package-data]
src = ["orders.json"]
